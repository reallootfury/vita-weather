    </g>
    <g stroke="#65ccff" stroke-width="5" stroke-linecap="round">
      <path d="M34 111l-4 9"/><path d="M55 111l-4 9"/><path d="M76 111l-4 9"/>
    </g>
    <text x="102" y="72" fill="url(#wordmark)" font-family="sans-serif" font-size="29" font-weight="700" letter-spacing="1">VITA</text>
    <text x="99" y="108" fill="url(#wordmark)" font-family="sans-serif" font-size="32" font-weight="700">WEATHER</text>
    <rect x="102" y="117" width="143" height="3" rx="1.5" fill="#65ccff" opacity="0.9"/>
